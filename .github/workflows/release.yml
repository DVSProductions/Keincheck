name: Release

# Push a semver tag (e.g. v0.2.0) to build and publish a Velopack release to
# GitHub. vpk creates the GitHub release, uploads the installer + update packages,
# and (given a prior release) generates delta packages.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      # Full history, not the default shallow clone: the release-notes step below reads
      # the previous tag and the commit log between the two.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install vpk
        run: dotnet tool install -g vpk

      - name: Derive version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # -p:Version makes the TAG authoritative for the assembly version, not just for the
      # Velopack package name. Without it the hub reported whatever Directory.Build.props
      # happened to say, so tagging without bumping props shipped a release whose installer
      # said one version and whose tray, hub_status and update check said another.
      - name: Publish Hub (self-contained, win-x64, ReadyToRun for faster startup)
        run: >
          dotnet publish Keincheck.Hub/Keincheck.Hub.csproj
          -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true
          -p:Version=${{ steps.ver.outputs.version }} -o publish

      - name: Publish the shim (Native AOT) and co-locate it with the hub
        # keincheck-connect.exe must ship alongside the hub: it is the stdio bridge the AI's
        # MCP client spawns, and the hub's "Set up AI assistant" points the client at this
        # co-located path. Native AOT makes it a small, instant-start, runtime-free native exe.
        run: |
          dotnet publish Keincheck.Connect/Keincheck.Connect.csproj -c Release -r win-x64 -o publish-shim
          Copy-Item publish-shim/keincheck-connect.exe publish/ -Force

      - name: Download prior releases (for delta packages)
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}

      - name: Pack
        run: >
          vpk pack -u Keincheck.Hub -v ${{ steps.ver.outputs.version }}
          -p publish -e Keincheck.Hub.exe
          --icon assets/icon.ico
          --packTitle "Keincheck Hub" --packAuthors "Valentino Saitz"

      - name: Upload to GitHub release
        run: >
          vpk upload github --repoUrl https://github.com/${{ github.repository }}
          --publish --merge
          --releaseName "Keincheck Hub ${{ steps.ver.outputs.version }}"
          --tag ${{ github.ref_name }}
          --token ${{ secrets.GITHUB_TOKEN }}

      # vpk publishes the release with an empty body, so every release page used to say
      # nothing about what changed. Runs after the upload because it edits the release
      # vpk just created.
      #
      # GitHub's generate-notes is preferred — it credits each merged PR and its author —
      # but it lists ONLY merged pull requests, so it returns an empty section for work
      # that landed as direct commits on main. Most of this project's history is exactly
      # that, hence the commit-log fallback.
      - name: Write release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" ${prev:+-f previous_tag_name="$prev"} -q .body > notes.md

          if ! grep -q '^\* ' notes.md; then
            {
              echo "## What's Changed"
              echo
              git log --no-merges --reverse --format='* %s (%h)' ${prev:+$prev..}"$TAG"
              echo
              if [ -n "$prev" ]; then
                echo "**Full Changelog**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$prev...$TAG"
              else
                echo "**Full Changelog**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commits/$TAG"
              fi
            } > notes.md
          fi

          gh release edit "$TAG" --notes-file notes.md
